<script>
// Ferroresonance engine — per-unit, illustrative.
// Open phase: Thevenin series loop  e = vc + dλ/dt ,  C·dvc/dt = im(λ) + vL/R
// Closed phase: vL = source,  dλ/dt = vL - λ/τdc (residual flux decays slowly)
const PH = [0, -2.0944, 2.0944];
const KNEE = 1.4, ARR_FAIL = 1, TAU_H = 300, FUSE_TRIP = 2.25;
const RW = 0.04; // winding resistance, bleeds trapped charge
const DRIVE = { gwye: 0.05, fwye: 0.75, delta: 0.9 };
// Grounded-wye padmount (URD): 4/5-leg core couples the phases magnetically, so the open phase still gets a weak back-feed.
// Grounded-wye bank of single-phase pole cans (OH): no coupling path.
const GWYE_PM = 0.5;
function im(l) { return 0.003 * l + 0.004 * Math.pow(l, 11); }
function makeSim() {
  return {
    t: 0, conn: 'delta', lengthFt: 2500, loadPct: 0,
    ph: [0, 1, 2].map(p => ({ cut: 'closed', l: -Math.cos(PH[p]), vc: Math.sin(PH[p]), vL: Math.sin(PH[p]), vg: Math.sin(PH[p]), i: 0, iF: 0, heat: 0, arr: 0, arrFailed: false })),
    events: []
  };
}
function stepSim(s, dt, log) {
  const capFt = s.lengthFt * (s.feed === 'oh' ? 0.03 : 1); // overhead conductor: a few % of URD cable capacitance per foot
  const Xc = 18000 / Math.max(1, capFt), C = 1 / Xc;
  let R = s.loadPct > 0 ? 100 / s.loadPct : 60; // 60 pu ≈ core loss only
  const pm5 = s.conn === 'gwye' && s.feed !== 'oh';
  if (s.conn === 'gwye' && !pm5) R = Math.min(R, 2); // single-phase cans: open winding is clamped, heavily damped
  const nOpen = s.ph.filter(p => p.cut !== 'closed').length;
  const E = nOpen === 3 ? 0 : (pm5 ? GWYE_PM : DRIVE[s.conn]) * (nOpen === 2 ? 1.1 : 1);
  s.t += dt;
  const hs = s.heatScale || 1;
  let backI = 0;
  s.ph.forEach((p, k) => {
    if (p.arrFailed) { p.vL = 0; p.vg = 0; p.l *= 0.99; p.i = 0; return; }
    if (p.cut === 'closed') {
      const v = Math.sin(s.t + PH[k]);
      p.vL = v; p.vg = v; p.l += dt * (v - p.l * 0.01); p.vc = v;
      p.i = im(p.l) + v / R;
    } else {
      const f = (l, vc) => { const e = E * Math.sin(s.t + PH[k]); const vL = e - vc - RW * im(l); return [vL, (im(l) + vL / R) / C]; };
      const a = f(p.l, p.vc), b = f(p.l + dt / 2 * a[0], p.vc + dt / 2 * a[1]),
        c = f(p.l + dt / 2 * b[0], p.vc + dt / 2 * b[1]), d = f(p.l + dt * c[0], p.vc + dt * c[1]);
      p.l += dt / 6 * (a[0] + 2 * b[0] + 2 * c[0] + d[0]);
      p.vc += dt / 6 * (a[1] + 2 * b[1] + 2 * c[1] + d[1]);
      p.vL = E * Math.sin(s.t + PH[k]) - p.vc - RW * im(p.l);
      p.vg = p.vc;
      p.i = im(p.l) + p.vL / R;
      if (s.conn !== 'gwye') backI += Math.abs(p.i); else if (pm5) backI += 0.5 * Math.abs(p.i);
    }
    // arrester
    const over = Math.abs(p.vg) - KNEE;
    if (over > 0) p.arr += over * over * dt * hs * 0.03; else p.arr = Math.max(0, p.arr - dt * hs * 0.0006);
    if (p.arr >= ARR_FAIL && !p.arrFailed) {
      p.arrFailed = true; p.arr = ARR_FAIL;
      log && log('bad', `Arrester on phase ${'ABC'[k]} failed short to ground after absorbing ferroresonant overvoltage.`);
      s.ph.forEach((q, j) => { if (q.cut === 'closed') q.heat = 99 * TAU_H; });
    }
  });
  const nClosed = 3 - nOpen;
  s.ph.forEach((p, k) => {
    if (p.cut !== 'closed') { p.iF = 0; p.heat = Math.max(0, p.heat - dt * hs * p.heat / TAU_H); return; }
    p.iF = Math.abs(p.i) + 3 * backI; // saturation spikes are large relative to a small can's fuse link
    p.heat += dt * hs * (p.iF * p.iF - p.heat / TAU_H);
    if (p.heat > FUSE_TRIP * TAU_H) {
      p.cut = 'blown'; p.vc = p.vL;
      log && log('bad', p.heat > 50 * TAU_H ? `Fuse ${'ABC'[k]} blew clearing the arrester fault.` : `Fuse ${'ABC'[k]} blew from sustained saturation current spikes.`);
    }
  });
}

    if (faultB.length) f.push(['bad', `That short blew the fuse${faultB.length > 1 ? 's' : ''} on ${list(faultB)}. The whole bank went out.`]);
    if (selfB.length) f.push(['bad', `The fuse${selfB.length > 1 ? 's' : ''} on ${list(selfB)} melted from the extra current.`]);
    if (restored) f.push([rang ? 'warn' : 'good', 'Once all three switches were closed, every transformer was fed normally again' + (rang ? ' and the swinging stopped.' : '.')]);
    head = bad ? 'The bank burned itself up.' : restored ? (rang ? 'Closing the last switch stopped it, this time.' : 'Power restored with no trouble.') : rang ? 'It\'s swinging, but nothing has broken yet.' : `${kN} stayed calm.`;
    if (!custom) { why = ss.why; swingTxt = ss.swing; }
    else if (bad || rang) { why = 'The cable stored enough energy, and there wasn\'t enough load to slow it down, so it started swinging out of control.'; swingTxt = 'A long cable is a strong push, and with too little load nobody is dragging their feet.'; }
    else if (gCans()) { why = 'The grounded-wye wiring and separate cans kept the open transformer tied to ground, so it couldn\'t be fed backwards.'; swingTxt = 'Grounded wiring holds the swing still.'; }
    else if (gPad()) { why = 'The grounded wiring weakened the push. The pad-mount\'s shared iron core still fed some voltage into the open phase, but not enough to get it swinging this time.'; swingTxt = 'Grounded wiring holds the swing with one hand. It can still move.'; }
    else if (sim.feed === 'oh') { why = 'Overhead wire stores very little energy compared with underground cable, so there wasn\'t enough to get it swinging.'; swingTxt = 'Overhead wire is a weak push.'; }
    else if (sim.loadPct >= 10) { why = 'The homes were using enough power to act like brakes.'; swingTxt = 'The homes drag their feet, so the swing can\'t build up.'; }
    else { why = 'There wasn\'t enough cable to store the energy needed to get it swinging.'; swingTxt = 'A short cable is a weak push.'; }
    take = ss.take;
  } else {
    if (custom) f.push(['warn', `Your setup: ${CONN_TXT[sim.conn]} bank, ${sim.lengthFt.toLocaleString()} ft of ${sim.feed === 'oh' ? 'overhead line' : 'URD cable'}, ${sim.loadPct}% load.`]);
    f.push(['', `You ${seqWords('cutout')}.`]);
    if (rang) { f.push(['bad', `About ${r.ferroAt} second${r.ferroAt === 1 ? '' : 's'} into the single-phase condition, ${kN} jumped into ferroresonance.`]);
      f.push(['bad', `It hit ${r.maxOpenV.toFixed(1)}× normal voltage, about ${(r.maxOpenV*7.2).toFixed(0)} kV to ground on a 7.2 kV phase.`]); }
    else if (restored && r.maxOpenV === 0 && !gCans()) f.push(['good', 'All three cutouts were closed before the open phases had time to settle into ferroresonance.']);
    else f.push(['good', `The open phase settled at ${r.maxOpenV.toFixed(2)}× normal. No ferroresonance.`]);
    if (r.arr) f.push(['bad', `The arrester on ${NAMES[r.arr.k]} conducted on every peak and failed short to ground.`]);
    if (selfB.length) f.push(['bad', `Fuse${selfB.length > 1 ? 's' : ''} ${list(selfB)} melted from the saturation current alone.`]);
    if (faultB.length) f.push(['bad', `Fuse${faultB.length > 1 ? 's' : ''} ${list(faultB)} blew clearing the arrester fault.`]);
    if (restored) f.push([rang ? 'warn' : 'good', 'With all three cutouts closed, every winding was fed from the line' + (rang ? ' and the ringing stopped.' : '.')]);
    head = bad ? 'The bank burned itself down.' : restored ? (rang ? 'Closing the last cutout ended it, this time.' : 'Restored cleanly. No ferroresonance.') : rang ? 'It rang, but nothing failed yet.' : 'The open phase stayed quiet.';
    why = s.why;
    if (custom) why = bad || rang
      ? (gPad() ? 'Even with a grounded neutral, the 4/5-leg core of this pad-mount coupled flux from the energized phases into the open leg. That leg and its cable capacitance traded energy, and with too little load to soak it up, the core saturated every half cycle.' : 'The cable stored energy like a capacitor and the core of the open can stored it like a coil. With too little load to soak it up and no grounded neutral to break the loop, they traded energy until the core saturated every half cycle.')
      : (gCans() ? 'Separate grounded-wye cans give each winding its own path and share no core, so the open phase is not back-fed into the cable.' : gPad() ? 'The grounded neutral weakens the back-feed. The shared 4/5-leg core still couples some voltage into the open phase, but here it was not enough to saturate the core.' : sim.feed === 'oh' ? 'Overhead conductor has a small fraction of URD cable capacitance, not enough to drive the core into saturation.' : sim.loadPct >= 10 ? 'The load damped it. It used up the energy before the cable and core could build it up.' : 'There was not enough cable capacitance to drive the core into saturation.');
    take = s.take;
  }
  done.add(scen); document.querySelectorAll('#scenBtns button').forEach(b => b.classList.toggle('done', done.has(+b.dataset.i)));
  const nx = SCEN[scen + 1], nxName = nx ? (simple ? SIMPLE[scen + 1].short : nx.short) : '';
  const deg = bad ? 72 : rang ? 55 : r.maxOpenV < 0.3 ? 0 : 14;
  $('#win').style.setProperty('--k', bad ? 'var(--bad)' : rang ? 'var(--warn)' : 'var(--good)');
  $('#win').innerHTML = `<div class="eyebrow">What happened · ${simple ? ss.short : s.title}</div>
    <h2 id="winTitle">${head}</h2>
    <ul class="facts">${f.map(([c, t]) => `<li class="${c}">${t}</li>`).join('')}</ul>
    ${simple ? `<div class="swingRow">${swingSvg(deg)}<p><b>Think of a swing</b>${swingTxt}</p></div>` : ''}
    <p><b>Why:</b> ${why}</p>
    <div class="take">${take}</div>
    <div style="font-size:12px;color:var(--muted)">${OWNER}</div>
    <div class="winBtns"><button class="btn" type="button" id="wClose">Keep watching</button><button class="btn" type="button" id="wAgain">Run again</button>${nx ? `<button class="btn primary" type="button" id="wNext">Next: ${nxName} ▶</button>` : ''}</div>`;
  openModal();
  $('#wClose').addEventListener('click', closeModal);
  $('#wAgain').addEventListener('click', () => { closeModal(); loadScen(scen); });
  if (nx) $('#wNext').addEventListener('click', () => { closeModal(); loadScen(scen + 1); });
  ($('#wNext') || $('#wAgain')).focus();
}
let lastFocus = null;
function openModal(){ modal = true; lastFocus = document.activeElement; $('#winScrim').hidden = false; }
function closeModal(){ modal = false; $('#winScrim').hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
$('#winScrim').addEventListener('click', e => { if (e.target === $('#winScrim')) closeModal(); });

/* ---------- tutorial + coach tips ---------- */
const STEPS_TECH = [
  { t: 'Welcome', x: 'This shows what happens inside a transformer bank when one phase is opened and the bank goes into ferroresonance. It takes about a minute to learn.' },
  { el: '#scenArea', t: 'Pick a scenario', x: 'Each button loads a bank setup. Start with 1 and work across. The line under the buttons tells you what to do.' },
  { el: '#cuts', t: 'Operate the cutouts', x: 'Tap A, B, or C here, or tap the cutout on the pole. The restore scenarios start with the bank dead after an outage, and you close the cutouts one at a time.' },
  { el: '#scene', t: 'Watch the cans', x: 'Each can fills red as its fuse or arrester gets closer to failing. A can shakes when its core saturates. The number above it is its voltage to ground, where 1.00 is normal.' },
  { el: '#sliders', t: 'Change the bank', x: 'Length is the run from the riser to the bank. URD or OH sets whether it is underground cable or overhead conductor. Load is how much the houses pull. Bank is how the primary is connected. Change them while it runs. Where ringing starts depends on transformer size and core type, so treat these lengths as an example, not a rule.' },
  { el: '#meterCard', t: 'Read the meter', x: 'Each phase\'s voltage is drawn live. Past the red dashed line, the arrester starts conducting. Tap "Inside the can" to see the electrons and the iron core.' },
  { t: 'Then a window explains it', x: 'When the situation plays out, a window pops up with what happened, why, and a button to the next scenario. Prevent it at the top covers field practice and arc-flash safety. Press Tutorial any time to see this again.' }
];
const STEPS_SIMPLE = [
  { t: 'Welcome', x: 'This shows what can happen when one switch on a group of three transformers is opened. Sometimes nothing happens. Sometimes the voltage swings out of control and burns parts up. This takes about a minute.' },
  { t: 'The big idea: a swing', x: 'The underground cable stores energy like a battery. A transformer\'s iron core stores energy like a spring. If one switch is opened, they can start passing energy back and forth, like a swing being pushed higher and higher. If nothing slows it down, the voltage keeps climbing, to about 2× normal, sometimes more.' },
  { el: '#scenArea', t: 'Try each situation', x: 'Each button sets up a different situation. Start with 1 and work across. The line underneath tells you what to do.' },
  { el: '#cuts', t: 'Open or close a switch', x: 'These are the switches (called cutouts) for the three wires: A, B, and C. Tap one here or on the pole to open or close it. Some situations start with the power out, and you close them one at a time.' },
  { el: '#scene', t: 'Watch the transformers', x: 'The number over each transformer is its voltage. 1.0× is normal. A transformer fills with red as its parts get closer to burning up, and it shakes when its iron is overloaded.' },
  { el: '#sliders', t: 'Change the setup', x: 'Length is how far the wire runs from the switches to the transformers. URD means underground cable, OH means overhead wire on poles. Homes is how much power they use. Wiring is how the transformers are hooked up. You can change these while it runs. How much cable is too much depends on the transformer\'s size and type, so these numbers are examples, not rules.' },
  { el: '#meterCard', t: 'Read the meter', x: 'Each colored line is one wire\'s voltage. Normal stays in the green band. If a line crosses the red dashed line, the arrester has to dump the extra. Tap "Inside" to look inside the transformer.' },
  { t: 'Tips will pop up', x: 'While it runs, short tips pause the action and point at what to look at. When it\'s over, a window explains what happened. The ⚠ Prevent it button shows how crews stop this in the field. Press Tutorial at the top to see this again.' }
];
const steps = () => simple ? STEPS_SIMPLE : STEPS_TECH;
let tutOn = false, tutI = 0, tutKind = 'tour', coachData = null;
function startTut(){ tutKind = 'tour'; tutOn = true; tutI = 0; $('#tut').hidden = false; showStep(); }
function coach(sel, t, x){ tutKind = 'coach'; coachData = { el: sel, t, x }; tutOn = true; $('#tut').hidden = false; showStep(); }
function endTut(){ const was = tutKind; tutOn = false; $('#tut').hidden = true; if (run) run.quietSince = null;
  if (was === 'tour') { try { localStorage.setItem('ferroTutDone', '1'); } catch (e) {} } }
function place(st){
  const hole = $('#hole'), tip = $('#tip'), vw = innerWidth, vh = innerHeight, tw = Math.min(340, vw - 24);
  $('#tipTitle').textContent = st.t; $('#tipText').textContent = st.x;
  if (st.el && $(st.el)) {
    const r = $(st.el).getBoundingClientRect(), pad = r.width < 40 ? 14 : 6;
    hole.classList.remove('none');
    Object.assign(hole.style, { left: (r.left - pad) + 'px', top: (r.top - pad) + 'px', width: (r.width + pad*2) + 'px', height: (r.height + pad*2) + 'px' });
    const th = tip.offsetHeight || 180;
    let top = r.bottom + pad + 10; if (top + th > vh - 8) top = r.top - pad - th - 10; if (top < 8) top = Math.max(8, vh - th - 8);
    const left = Math.min(Math.max(12, r.left + r.width/2 - tw/2), vw - tw - 12);
    Object.assign(tip.style, { left: left + 'px', top: top + 'px' });
  } else {
    hole.classList.add('none'); Object.assign(hole.style, { left: '50%', top: '40%', width: '0px', height: '0px' });
    Object.assign(tip.style, { left: (vw - tw)/2 + 'px', top: Math.max(12, vh*0.28) + 'px' });
  }
}
function showStep(){
  if (tutKind === 'coach') {
    $('#tipN').textContent = 'Tip'; $('#tipBack').hidden = true; $('#tipSkip').textContent = 'No more tips'; $('#tipNext').textContent = 'Continue';
    place(coachData);
    // let the tip measure itself, then place again
    requestAnimationFrame(() => tutOn && tutKind === 'coach' && place(coachData));
  } else {
    const S = steps();
    $('#tipN').textContent = `Step ${tutI + 1} of ${S.length}`; $('#tipBack').hidden = false; $('#tipBack').disabled = tutI === 0;
    $('#tipSkip').textContent = 'Skip'; $('#tipNext').textContent = tutI === S.length - 1 ? 'Start' : 'Next';
    place(S[tutI]); requestAnimationFrame(() => tutOn && tutKind === 'tour' && place(S[tutI]));
  }
  $('#tipNext').focus();
}
$('#tipNext').addEventListener('click', () => { if (tutKind === 'coach') return endTut(); if (tutI < steps().length - 1) { tutI++; showStep(); } else { endTut(); $('#btnTut').focus(); } });
$('#tipBack').addEventListener('click', () => { if (tutI > 0) { tutI--; showStep(); } });
$('#tipSkip').addEventListener('click', () => { if (tutKind === 'coach') tipsOn = false; endTut(); });
$('#btnTut').addEventListener('click', startTut);
/* ---------- prevention + safety panel ---------- */
const PREV_TECH = {
  h: 'How crews prevent it',
  li: ['Use gang-operated (three-phase) switching so the bank is never single-phased.',
    'If cutouts must be closed one at a time, close all three quickly. Use multiple hot sticks so the gap between phases is seconds, not minutes. The time lag between phases is the biggest factor.',
    'Pull the elbows or bayonet fuses so the transformer is off the cable while the primary is switched. Energize the cable first, then the transformer.',
    'Energize with load connected, or with the secondary already live where your procedures allow, so there is resistance to damp it.',
    'Switch as close to the bank as you can to keep cable capacitance out of the circuit.'],
  ov: 'Ferroresonant overvoltage is typically about 2× normal, sometimes more. Arresters conduct on every peak and can fail within seconds, and the fault takes the fuses with it.',
  len: 'There is no single safe cable length. It depends on transformer kVA and core type. Low-loss cores and grounded-wye pad-mounts with 4- or 5-leg cores can ring on runs a fraction of the older rule-of-thumb lengths.',
  arc: 'Arc flash: on 25 kV and 35 kV class systems, a ferroresonating bank can fail violently at the arrester, elbow, or tank. Treat a single-phased bank as energized and unstable, wear arc-rated PPE for the full incident energy, keep your distance, and follow your company\'s switching procedures.',
  src: 'Sources: R. A. Walling, IEEE PES Ferroresonance Working Group panel paper (low-loss transformers); Lindholm utility ferroresonance case study; Incident Prevention, "Understanding and Preventing Ferroresonance"; IEEE, "Ferroresonance During Single-Phase Switching of 3-Phase Distribution Transformer Banks." Training aid only. Your utility\'s procedures come first.'
};
const PREV_SIMPLE = {
  h: 'How line crews stop it',
  li: ['Close all three switches at the same time with a three-phase switch, so there is no in-between moment.',
    'If the switches have to be closed one at a time, close them fast. Use more than one hot stick so there is very little delay between them.',
    'Unplug the transformer (pull the elbows or bayonet fuses) while switching. Turn the cable on first, then plug the transformer back in.',
    'Turn power on with homes or load connected, so something is there to slow the swing.',
    'Switch as close to the transformers as you can, so less cable is involved.'],
  ov: 'How bad it gets: about 2× normal voltage, sometimes more. That is enough to burn up arresters and blow fuses.',
  len: 'How much cable is too much? There is no single number. It depends on the transformer\'s size and type. Newer, more efficient transformers can swing on shorter runs.',
  arc: 'Arc flash danger: on higher-voltage systems (25 kV and up), a transformer swinging out of control can fail violently. Treat it as live and unstable, wear arc-rated gear, keep your distance, and follow your company\'s procedures.',
  src: 'Based on IEEE and utility guidance on ferroresonance. Training aid only. Your company\'s procedures come first.'
};
function showPrevent(){
  const P = simple ? PREV_SIMPLE : PREV_TECH;
  $('#win').style.setProperty('--k', 'var(--warn)');
  $('#win').innerHTML = `<div class="eyebrow">${simple ? 'In the field' : 'Field practice'}</div>
    <h2 id="winTitle">${P.h}</h2>
    <ul class="facts">${P.li.map(t => `<li class="good">${t}</li>`).join('')}</ul>
    <p>${P.ov}</p>
    <p>${P.len}</p>
    <div class="warnBox"><b>⚠ </b>${P.arc}</div>
    <div style="font-size:12px;color:var(--muted)">${P.src}<br>${OWNER}</div>
    <div class="winBtns"><button class="btn primary" type="button" id="wClose">Got it</button></div>`;
  openModal();
  $('#wClose').addEventListener('click', closeModal);
  $('#wClose').focus();
}
$('#btnSafe').addEventListener('click', () => { if (tutOn) endTut(); showPrevent(); });

addEventListener('resize', () => { if (tutOn) showStep(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (tutOn) endTut(); else if (modal) closeModal(); } });

/* ---------- simple / technical ---------- */
function applyMode(){
  document.body.classList.toggle('simple', simple);
  document.querySelectorAll('#mode button').forEach(b => b.setAttribute('aria-pressed', (b.dataset.m === 'simple') === simple));
  $('#lenL').textContent = 'Length'; $('#loadL').textContent = simple ? 'Homes' : 'Load'; $('#connL').textContent = simple ? 'Wiring' : 'Bank';
  $('#insideBtn').textContent = simple ? 'Inside' : 'Inside the can';
  buildScen(); document.querySelectorAll('#scenBtns button').forEach(b => { b.setAttribute('aria-pressed', +b.dataset.i === scen); b.classList.toggle('done', done.has(+b.dataset.i)); });
  $('#task').innerHTML = simple ? SIMPLE[scen].task : `<b>${SCEN[scen].title}.</b> ${SCEN[scen].task}`;
  if (sim) drawCoil();
  try { localStorage.setItem('ferroMode', simple ? 'simple' : 'tech'); } catch (e) {}
}
document.querySelectorAll('#mode button').forEach(b => b.addEventListener('click', () => { simple = b.dataset.m === 'simple'; applyMode(); }));

/* ---------- loop ---------- */
let last = performance.now(), prevCuts = '';
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  if (running && !modal && !tutOn) {
    const rad = speed*2*Math.PI*dt, n = Math.max(1, Math.round(rad/0.004)), d = rad/n;
    for (let j = 0; j < n; j++) {
      pending.forEach((pd, k) => { if (pd && Math.abs(Math.sin(sim.t + PH[k])) > 0.97) { if (!run.openWall) run.openWall = performance.now(); pending[k] = false; sim.ph[k].cut = 'open'; openAt[k] = sim.t; } });
      stepSim(sim, d); acc += d; if (acc >= SAMP) { acc -= SAMP; buf.push(sim.ph.map(p => p.vg || 0)); if (buf.length > BUF) buf.shift(); } }
    sim.ph.forEach((p, k) => { dotOff[k] -= (p.i || 0)*30*dt*(speed/0.35); const dd = $('#dot'+k); dd.style.strokeDashoffset = dotOff[k].toFixed(1); dd.style.opacity = Math.min(1, .15 + Math.abs(p.i || 0)).toFixed(2); });
    const c = sim.ph.map(p => p.cut).join() + pending.join(); if (c !== prevCuts) { prevCuts = c; syncCuts(); }
  }
  status(); view === 'scope' ? drawScope() : drawInside(now, dt);
  requestAnimationFrame(frame);
}

/* ---------- wiring ---------- */
function setSpeed(v){ speed = v; document.querySelectorAll('#speed button').forEach(x => x.setAttribute('aria-pressed', +x.dataset.s === v)); }
function setView(v){ view = v; document.querySelectorAll('[data-view]').forEach(x => x.setAttribute('aria-pressed', x.dataset.view === v)); }
$('#btnRun').addEventListener('click', () => { running = !running; $('#btnRun').textContent = running ? '❚❚' : '▶'; $('#btnRun').setAttribute('aria-label', running ? 'Pause' : 'Run'); });
$('#btnReset').addEventListener('click', () => { newSim(); syncCuts(); });
document.querySelectorAll('#speed button').forEach(x => x.addEventListener('click', () => setSpeed(+x.dataset.s)));
document.querySelectorAll('[data-view]').forEach(x => x.addEventListener('click', () => setView(x.dataset.view)));
$('#len').addEventListener('input', e => setLen(e.target.value));
$('#load').addEventListener('input', e => setLoad(e.target.value));
document.querySelectorAll('#conn button').forEach(x => x.addEventListener('click', () => setConn(x.dataset.v)));
document.querySelectorAll('#feed button').forEach(x => x.addEventListener('click', () => setFeed(x.dataset.v)));

readTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme);
new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
buildScene(); buildCuts(); buildScen(); setSpeed(0.35); loadScen(SCEN.length - 1); applyMode();
requestAnimationFrame(() => { const b = document.querySelector('#scenBtns button[aria-pressed="true"]'); if (b) b.parentElement.scrollLeft = b.offsetLeft; });
if (!running) { $('#btnRun').textContent = '▶'; $('#btnRun').setAttribute('aria-label', 'Run'); }
let seen = false; try { seen = localStorage.getItem('ferroTutDone') === '1'; } catch (e) {}
if (!seen) requestAnimationFrame(() => startTut());
requestAnimationFrame(frame);
})();
</script>

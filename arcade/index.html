<style>
/* Layout: one 16:9 arcade screen scaled to fit, CRT scanlines over it, touch controls under it on phones. Single committed dark look (matches the cabinet art). */
:root{
  --night:#0b0716; --deep:#120a24; --violet:#2b1450; --magenta:#a3216a; --hot:#e2452e; --amber:#ff9a1f; --sun:#ffd23a; --cyan:#7fe7ff; --white:#f6f2ff;
  --f-pixel:"Press Start 2P","Courier New",monospace;
  --f-body:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--white);font-family:var(--f-body);overflow:hidden;touch-action:manipulation}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-inline:16px;padding-block:8px;box-sizing:border-box}
.screen{position:relative;width:min(100%, calc((100% - 0px) * 1));aspect-ratio:16/9;max-width:100%;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 0 0 3px #000,0 0 40px rgba(226,69,46,.25)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:auto}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45) 100%)}
.pad{display:none;width:100%;max-width:560px;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr)) repeat(3,minmax(0,1fr))}
@media (pointer:coarse),(max-width:700px){.pad{display:grid}}
.pad button{font-family:var(--f-pixel);font-size:10px;line-height:1.3;color:var(--white);background:var(--deep);border:2px solid var(--violet);border-radius:12px;min-height:54px;padding:6px 4px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.pad button:active{background:var(--violet)}

<div class="wrap" id="wrap">
  <div class="screen" id="screen"><canvas id="cv" width="960" height="540" aria-label="Ferroresonance arcade game"></canvas></div>

</div>

<script>
// Ferroresonance engine — per-unit, illustrative.
// Open phase: Thevenin series loop  e = vc + dλ/dt ,  C·dvc/dt = im(λ) + vL/R
// Closed phase: vL = source,  dλ/dt = vL - λ/τdc (residual flux decays slowly)
const PH = [0, -2.0944, 2.0944];
const KNEE = 1.4, ARR_FAIL = 1, TAU_H = 300, FUSE_TRIP = 2.25;
const RW = 0.04; // winding resistance, bleeds trapped charge
const DRIVE = { gwye: 0.05, fwye: 0.75, delta: 0.9 };
// Grounded-wye padmount (URD): 4/5-leg core couples the phases magnetically, so the open phase still gets a weak back-feed.
// Grounded-wye bank of single-phase pole cans (OH): no coupling path.
const GWYE_PM = 0.5;
// MOV arrester: stiff conduction above the clamp level keeps the open phase near 2 pu, at the cost of heat
const CLAMP = 1.95, GA = 0.02;
function iArr(v) { const a = Math.abs(v) / CLAMP; return a < 0.8 ? 0 : Math.sign(v) * GA * Math.pow(a, 24); }
function im(l) { return 0.003 * l + 0.004 * Math.pow(l, 11); }
function makeSim() {
  return {
    t: 0, conn: 'delta', lengthFt: 2500, loadPct: 0,
    ph: [0, 1, 2].map(p => ({ cut: 'closed', l: -Math.cos(PH[p]), vc: Math.sin(PH[p]), vL: Math.sin(PH[p]), vg: Math.sin(PH[p]), i: 0, iF: 0, heat: 0, arr: 0, arrFailed: false })),
    events: []
  };
}
function stepSim(s, dt, log) {
  const capFt = s.lengthFt * (s.feed === 'oh' ? 0.03 : 1); // overhead conductor: a few % of URD cable capacitance per foot
  const Xc = 18000 / Math.max(1, capFt), C = 1 / Xc;
  let R = s.loadPct > 0 ? 100 / s.loadPct : 60; // 60 pu ≈ core loss only
  const pm5 = s.conn === 'gwye' && s.feed !== 'oh';
  if (s.conn === 'gwye' && !pm5) R = Math.min(R, 2); // single-phase cans: open winding is clamped, heavily damped
  const nOpen = s.ph.filter(p => p.cut !== 'closed').length;
  const E = nOpen === 3 ? 0 : (pm5 ? GWYE_PM : DRIVE[s.conn]) * (nOpen === 2 ? 1.1 : 1);
  s.t += dt;
  const hs = s.heatScale || 1;
  let backI = 0;
  s.ph.forEach((p, k) => {
    if (p.arrFailed) { p.vL = 0; p.vg = 0; p.l *= 0.99; p.i = 0; return; }
    if (p.cut === 'closed') {
      const v = Math.sin(s.t + PH[k]);
      p.vL = v; p.vg = v; p.l += dt * (v - p.l * 0.01); p.vc = v;
      p.i = im(p.l) + v / R;
    } else {
      const f = (l, vc) => { const e = E * Math.sin(s.t + PH[k]); const vL = e - vc - RW * im(l); return [vL, (im(l) + vL / R - iArr(vc)) / C]; };
      const a = f(p.l, p.vc), b = f(p.l + dt / 2 * a[0], p.vc + dt / 2 * a[1]),
        c = f(p.l + dt / 2 * b[0], p.vc + dt / 2 * b[1]), d = f(p.l + dt * c[0], p.vc + dt * c[1]);
      p.l += dt / 6 * (a[0] + 2 * b[0] + 2 * c[0] + d[0]);
      p.vc += dt / 6 * (a[1] + 2 * b[1] + 2 * c[1] + d[1]);
      p.vL = E * Math.sin(s.t + PH[k]) - p.vc - RW * im(p.l);
      p.vg = p.vc;
      p.i = im(p.l) + p.vL / R;
      if (s.conn !== 'gwye') backI += Math.abs(p.i); else if (pm5) backI += 0.5 * Math.abs(p.i);
    }
    // arrester
    const over = Math.abs(p.vg) - KNEE;
    if (over > 0) p.arr += (over * over * 0.03 + Math.abs(p.vg * iArr(p.vg)) * 0.2) * dt * hs; else p.arr = Math.max(0, p.arr - dt * hs * 0.0006);
    if (p.arr >= ARR_FAIL && !p.arrFailed) {
      p.arrFailed = true; p.arr = ARR_FAIL;
      log && log('bad', `Arrester on phase ${'ABC'[k]} failed short to ground after absorbing ferroresonant overvoltage.`);
      s.ph.forEach((q, j) => { if (q.cut === 'closed') q.heat = 99 * TAU_H; });
    }
  });
  const nClosed = 3 - nOpen;
  s.ph.forEach((p, k) => {
    if (p.cut !== 'closed') { p.iF = 0; p.heat = Math.max(0, p.heat - dt * hs * p.heat / TAU_H); return; }
    p.iF = Math.abs(p.i) + 3 * backI; // saturation spikes are large relative to a small can's fuse link
    p.heat += dt * hs * (p.iF * p.iF - p.heat / TAU_H);
    if (p.heat > FUSE_TRIP * TAU_H) {
      p.cut = 'blown'; p.vc = p.vL;
      log && log('bad', p.heat > 50 * TAU_H ? `Fuse ${'ABC'[k]} blew clearing the arrester fault.` : `Fuse ${'ABC'[k]} blew from sustained saturation current spikes.`);
    }
  });
}

(() => {
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = 960, H = 540;
const COL = { night:'#0b0716', deep:'#120a24', violet:'#2b1450', plum:'#5a1866', magenta:'#a3216a', hot:'#e2452e', amber:'#ff9a1f', sun:'#ffd23a', cyan:'#7fe7ff', white:'#f6f2ff', ground:'#07060b', pad:'#3d5a3a', padD:'#24361f', pA:'#ff9a1f', pB:'#c58bff', pC:'#5ef0a8', dim:'#8a7fb0' };
const PIX = '"Press Start 2P","Courier New",monospace', BODY = '"Barlow Condensed","Arial Narrow",sans-serif';
const NAMES = 'ABC', PCOL = [COL.pA, COL.pB, COL.pC];
const OWNER = '© 2026 CALEB LENZ. ALL RIGHTS RESERVED.';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const CYC = 2*Math.PI, GAME_SPEED = 1.0; // simulated cycles per real second (slow motion so you can see it)

/* ---------------- levels ---------------- */
const LEVELS = [
  { name:'FIRST LIGHT', mode:'restore', conn:'delta', feed:'urd', len:400, reach:0.75, homes:24,
    brief:['The storm is over and the bank is dead.','Short run: 400 ft of URD cable.','Close A, B and C to get the lights back on.'],
    win:'Short cable stores little energy, so the open phases had nothing to ring with.',
    lose:'Even short cable can ring if you leave the bank single-phased long enough.' },
  { name:'LONG RUN', mode:'restore', conn:'delta', feed:'urd', len:1800, reach:0.75, homes:32,
    brief:['1,800 ft of URD and no load on the bank.','While a cutout is open, that phase is back-fed','into all that cable. Do not leave it single-phased.'],
    win:'You kept the single-phase window short. The time between phases is the biggest factor.',
    lose:'The open phases sat on long cable with no load. The core saturated every half cycle and the arrester took the hits until it failed.' },
  { name:'PICK UP LOAD', mode:'restore', conn:'delta', feed:'urd', len:2200, reach:2.8, homes:40, loadSwitch:true, loadPct:30,
    brief:['2,200 ft run. The bucket has to reposition','between cutouts, so you cannot be fast here.','Close the homes\' main (MAIN) first. Load damps it.'],
    win:'Load is resistance. It burns off the energy before the cable and core can build it up.',
    lose:'Slow switching on an empty bank is the worst case. Energize with load connected when you can.' },
  { name:'OVERHEAD', mode:'restore', conn:'delta', feed:'oh', len:2500, reach:0.75, homes:28,
    brief:['Same kind of bank, fed by overhead conductor.','Overhead has a few percent of the capacitance','of URD cable per foot. Feel the difference.'],
    win:'Overhead conductor stores very little energy. Ferroresonance is mainly a URD problem.',
    lose:'Overhead is far less prone, but not impossible on a long enough run.' },
  { name:'TAKE IT DOWN', mode:'down', conn:'delta', feed:'urd', len:1800, reach:0.75, homes:32,
    brief:['The bank has to come out for maintenance.','Opening one phase at a time is risky too.','Open A, B and C. Keep the gap short.'],
    win:'De-energizing single-phase rings the same way energizing does. You kept the window short.',
    lose:'With one or two cutouts open, the open phases rang on the cable. Opening is as risky as closing.' },
  { name:'GROUNDED, NOT SAFE', mode:'down', conn:'gwye', feed:'urd', len:2500, reach:1.5, homes:36,
    brief:['Grounded-wye three-phase pad-mount, 2,500 ft.','The shared 5-leg core still links the phases','magnetically. Open A, B and C.'],
    win:'Grounding weakens the back-feed, but the shared core still coupled voltage into the open phase. Grounded wye resists ferroresonance. It is not immune.',
    lose:'Grounded wye resists ferroresonance. It is not immune.' },
  { name:'GANG SWITCH', mode:'restore', conn:'delta', feed:'urd', len:2500, reach:0.75, homes:48, gang:true,
    brief:['Longest run yet: 2,500 ft, no load.','A gang-operated switch is installed.','GANG closes all three phases at once.'],
    win:'Gang-operated switching never leaves the bank single-phased. That is the best fix there is.',
    lose:'Single-phase switching on 2,500 ft of cable with no load is a fuse and arrester killer.' }
];

/* ---------------- audio ---------------- */
let AC = null, hum = null, humGain = null, master = null;
function audio(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    hum = AC.createOscillator(); hum.type = 'sawtooth'; hum.frequency.value = 60;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500;
    humGain = AC.createGain(); humGain.gain.value = 0;
    hum.connect(f); f.connect(humGain); humGain.connect(master); hum.start();
  } catch (e) { AC = null; }
}
function tone(freq, dur, type, vol, when){ if (!AC) return; const t = AC.currentTime + (when || 0);
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02); }
function noise(dur, vol, hp){ if (!AC) return; const n = Math.floor(AC.sampleRate*dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1)*Math.pow(1 - i/n, 2);
  const s = AC.createBufferSource(); s.buffer = b; const f = AC.createBiquadFilter(); f.type = hp ? 'highpass' : 'lowpass'; f.frequency.value = hp ? 2500 : 700;
  const g = AC.createGain(); g.gain.value = vol; s.connect(f); f.connect(g); g.connect(master); s.start(); }
const sfx = {
  move: () => tone(440, 0.05, 'square', 0.04),
  clunk: () => { tone(110, 0.12, 'square', 0.1); noise(0.06, 0.2, true); },
  crack: () => noise(0.12, 0.35, true),
  boom: () => { noise(0.9, 0.9, false); tone(55, 0.8, 'sawtooth', 0.15); },
  coin: () => { tone(988, 0.08, 'square', 0.07); tone(1319, 0.25, 'square', 0.07, 0.08); },
  clear: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'square', 0.07, i*0.11)),
  over: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.3, 'triangle', 0.1, i*0.22)),
  breaker: () => { tone(220, 0.08, 'square', 0.08); tone(330, 0.1, 'square', 0.06, 0.06); }
};

/* ---------------- input (keyboard, iCade, touch) ---------------- */
const ICADE = { w:'up', x:'down', a:'left', d:'right', y:'b1', h:'b2', u:'b3', j:'b4', i:'b5', k:'b6', o:'b7', l:'b8' };
const ICADE_UP = new Set(['e','z','q','c','t','r','f','n','m','p','g','v']);
let lastKey = '', lastKeyT = 0;
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  let a = null;
  if (k === 'ArrowLeft') a = 'left'; else if (k === 'ArrowRight') a = 'right'; else if (k === 'ArrowUp') a = 'up'; else if (k === 'ArrowDown') a = 'down';
  else if (k === ' ' || k === 'Enter' || k === '1') a = 'b1'; else if (k === '2') a = 'b2'; else if (k === '3') a = 'b3';
  else if (ICADE[k]) a = ICADE[k]; else if (ICADE_UP.has(k)) { e.preventDefault(); return; }
  lastKey = (e.key === ' ' ? 'SPACE' : e.key.toUpperCase()) + (a ? ' = ' + a.toUpperCase() : ''); lastKeyT = performance.now();
  if (!a) return; e.preventDefault(); if (e.repeat && a.startsWith('b')) return; press(a);
});
document.querySelectorAll('#pad button').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); let a = b.dataset.a;
  if (a === 'up') a = state === 'initials' ? 'up' : 'down'; press(a); }));
cv.addEventListener('pointerdown', e => { // tap a cutout on the screen, or tap anywhere to continue
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left)/r.width*W, y = (e.clientY - r.top)/r.height*H;
  if (state === 'play' && y > 80 && y < 220) { const k = CUT_X.findIndex(cx => Math.abs(x - cx) < 26); if (k >= 0) { sel = k; press('b1'); return; } }
  if (state !== 'play') press('b1');
});

/* ---------------- high scores ---------------- */
const HS_KEY = 'ferroArcadeHi';
const DEFAULT_HS = [['ARC',9000],['GND',7000],['URD',5000],['CUT',3500],['FUS',2000],['OHL',1000]];
function loadHS(){ try { const v = JSON.parse(localStorage.getItem(HS_KEY)); if (Array.isArray(v) && v.length) return v; } catch (e) {} return DEFAULT_HS.slice(); }
function saveHS(){ try { localStorage.setItem(HS_KEY, JSON.stringify(hs)); } catch (e) {} }
let hs = loadHS();

/* ---------------- game state ---------------- */
let state = 'attract', stT = 0, attractPhase = 0;
let lvl = 0, score = 0, lives = 3, sel = 0, reach = 0, reachK = -1;
let sim = null, pending = [false,false,false], openAt = [null,null,null], buf = [], acc = 0;
let stats = null, result = null, loadOn = false, endT = 0, shake = 0, particles = [], flashT = 0;
let initials = ['A','A','A'], iPos = 0, demo = null;
const BUF = 260, SAMP = 0.05;

function newSim(L, demoMode){
  const s = makeSim(); s.heatScale = 4; s.conn = L.conn; s.feed = L.feed; s.lengthFt = L.len; s.loadPct = 0;
  if (L.mode === 'restore') s.ph.forEach(p => { p.cut = 'open'; p.vc = 0; p.vg = 0; p.vL = 0; p.i = 0; p.l = (Math.random() < .5 ? -1 : 1)*(0.6 + Math.random()*0.2); });
  else { const w = CYC*(1 + Math.random()); for (let t = 0; t < w; t += 0.004) stepSim(s, 0.004); }
  return s;
}
function startLevel(){
  const L = LEVELS[lvl]; sim = newSim(L); pending = [false,false,false]; openAt = [null,null,null]; buf = []; acc = 0;
  sel = 0; reach = 0; reachK = -1; loadOn = false; particles = []; endT = 0;
  stats = { sp:0, ring:0, peak:0, loadFirst:false, gang:false, firstOp:false, arrOn:[false,false,false] };
  if (L.mode === 'restore') stats.started = true;
}
function go(s){ state = s; stT = 0; }

function press(a){
  audio();
  if (state === 'attract') { if (a === 'down') { go('test'); return; } if (a.startsWith('b')) { sfx.coin(); lvl = 0; score = 0; lives = 3; startLevel(); go('brief'); } return; }
  if (state === 'test') { if (a === 'up') go('attract'); return; }
  if (state === 'brief') { if (a.startsWith('b') && stT > 0.4) { go('play'); } return; }
  if (state === 'result') { if (a.startsWith('b') && stT > 1.0) nextAfterResult(); return; }
  if (state === 'over' || state === 'win') { if (a.startsWith('b') && stT > 1.5) toInitialsOrAttract(); return; }
  if (state === 'initials') {
    const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    if (a === 'up' || a === 'down') { const c = A.indexOf(initials[iPos]); initials[iPos] = A[(c + (a === 'up' ? 1 : 25)) % 26]; sfx.move(); }
    else if (a === 'left') iPos = Math.max(0, iPos - 1); else if (a === 'right') iPos = Math.min(2, iPos + 1);
    else if (a.startsWith('b')) { if (iPos < 2) { iPos++; sfx.move(); } else { hs.push([initials.join(''), score]); hs.sort((x, y) => y[1] - x[1]); hs = hs.slice(0, 8); saveHS(); sfx.clear(); go('attract'); } }
    return;
  }
  if (state !== 'play') return;
  const L = LEVELS[lvl];
  if (a === 'left') { sel = (sel + 2) % 3; sfx.move(); }
  else if (a === 'right') { sel = (sel + 1) % 3; sfx.move(); }
  else if (a === 'b1') { if (reach > 0 || sim.ph[sel].arrFailed || sim.ph[sel].cut === 'blown' || pending[sel]) return; reach = L.reach; reachK = sel; }
  else if (a === 'b2' && L.loadSwitch) { loadOn = !loadOn; sim.loadPct = loadOn ? L.loadPct : 0; sfx.breaker(); if (loadOn && !stats.firstOp) stats.loadFirst = true; }
  else if (a === 'b3' && L.gang) { if (reach > 0) return; gangOperate(); }
}
function operate(k){
  const p = sim.ph[k]; stats.firstOp = true; sfx.clunk();
  if (p.cut === 'closed') pending[k] = true;
  else { p.cut = 'closed'; p.heat = 0; openAt[k] = null; p.l = -Math.cos(sim.t + PH[k]);
    [0,1,2].forEach(j => { if (sim.ph[j].cut !== 'closed' && !sim.ph[j].arrFailed) openAt[j] = sim.t; }); }
}
function gangOperate(){
  const L = LEVELS[lvl]; stats.firstOp = true; stats.gang = true; sfx.clunk(); sfx.clunk();
  sim.ph.forEach((p, k) => { if (L.mode === 'restore') { if (p.cut !== 'closed') { p.cut = 'closed'; p.heat = 0; p.l = -Math.cos(sim.t + PH[k]); openAt[k] = null; } } else if (p.cut === 'closed') pending[k] = true; });
}

/* ---------------- simulation tick ---------------- */
function peakOf(k, span){ let m = 0; for (let j = Math.max(0, buf.length - span); j < buf.length; j++) m = Math.max(m, Math.abs(buf[j][k])); return m; }
function simTick(s, dt, pend, oAt, onLog){
  const rad = GAME_SPEED*CYC*dt, n = Math.max(1, Math.round(rad/0.004)), d = rad/n;
  for (let j = 0; j < n; j++) {
    pend.forEach((pd, k) => { if (pd && Math.abs(Math.sin(s.t + PH[k])) > 0.97) { pend[k] = false; s.ph[k].cut = 'open'; oAt[k] = s.t; } });
    stepSim(s, d, onLog);
  }
}
function playTick(dt){
  const L = LEVELS[lvl];
  if (reach > 0) { reach -= dt; if (reach <= 0) { reach = 0; operate(reachK); reachK = -1; } }
  simTick(sim, dt, pending, openAt, () => {});

  else if (state === 'win') drawEnd(true);
